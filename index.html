<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b5bdb">
<title>English Coach - Học nói tiếng Anh</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--mute:#667089;--line:#e3e8f2;--pri:#3b5bdb;--pri2:#eef2ff;--ok:#2b8a3e;--okbg:#e6f6ea;--bad:#c92a2a;--badbg:#fdeaea;--warn:#e8890c;--warnbg:#fff4e0;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
#app{max-width:620px;margin:0 auto;min-height:100vh;padding:14px 14px 150px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:18px;margin:18px 0 8px}h3{font-size:16px;margin:12px 0 6px}
p{margin:6px 0}.mute{color:var(--mute)}.sm{font-size:13px}.c{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.card.tap{cursor:pointer}.card.tap:active{background:var(--pri2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:active{filter:brightness(.92)}.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--pri)}.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.bad{background:var(--bad);border-color:var(--bad)}.btn.warn{background:var(--warn);border-color:var(--warn)}
.btn.block{display:block;width:100%}.btn[disabled]{opacity:.45}
.chip{display:inline-block;padding:5px 11px;border-radius:999px;background:var(--pri2);color:var(--pri);font-size:13px;margin:3px 4px 3px 0;border:1px solid transparent;cursor:pointer}
.chip.on{background:var(--pri);color:#fff}.chip.plain{background:#f0f2f7;color:var(--ink);cursor:default}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#eef;color:var(--pri);font-weight:700}
.badge.g{background:var(--okbg);color:var(--ok)}.badge.o{background:var(--warnbg);color:var(--warn)}
input[type=text],input[type=search],textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:620px}
nav a{flex:1;text-align:center;padding:8px 2px 7px;color:var(--mute);text-decoration:none;font-size:11px;font-weight:600}
nav a b{display:block;font-size:21px;line-height:1.1}nav a.on{color:var(--pri)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}.back{background:none;border:0;font-size:24px;color:var(--pri);padding:0 8px 0 0;cursor:pointer}
.qtext{font-size:20px;font-weight:700;line-height:1.35}
.sample{background:#fafbff;border-left:4px solid var(--pri);padding:10px 12px;border-radius:8px;margin:8px 0}
.abar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.w{border-bottom:1px dotted #aab;cursor:pointer}.w:active{background:#ffe99a}
.sent{display:inline}.sent.cur{background:#fff3bf;border-radius:4px}
.stat{text-align:center;padding:10px 4px}.stat b{display:block;font-size:22px;color:var(--pri)}.stat span{font-size:12px;color:var(--mute)}
.prog{height:8px;background:#e8ecf6;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri)}
.todo{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.todo:last-child{border:0}
.todo .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;flex:none}
.todo.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.flash{position:relative;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;cursor:pointer}
.flash .big{font-size:30px;font-weight:800}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:16px;font-family:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pairs .opt{margin:0;text-align:center;padding:12px 6px;font-size:15px}.pairs .opt.sel{border-color:var(--pri);background:var(--pri2)}.pairs .opt.gone{visibility:hidden}
#sheet{position:fixed;inset:0;background:rgba(15,20,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
#sheet.show{display:flex}#sheet .box{background:#fff;width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 28px}
#np{position:fixed;left:10px;right:10px;bottom:70px;max-width:600px;margin:0 auto;background:#1d2433;color:#fff;border-radius:14px;padding:10px 12px;display:none;z-index:30;gap:10px;align-items:center}
#np.show{display:flex}#np .t{flex:1;font-size:14px}#np small{opacity:.7;display:block;font-size:11px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;display:none;max-width:90%}
.diff span{padding:1px 3px;border-radius:4px;margin-right:2px;display:inline-block}.diff .g{background:var(--okbg);color:var(--ok)}.diff .r{background:var(--badbg);color:var(--bad);text-decoration:underline}
.rec{width:74px;height:74px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:30px;cursor:pointer;display:grid;place-items:center;margin:0 auto}
.rec.on{animation:pulse 1.1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(201,42,42,.15)}}
details>summary{cursor:pointer;font-weight:700;padding:6px 0}pre.rep{white-space:pre-wrap;font-size:12px;background:#f6f7fb;padding:10px;border-radius:10px;max-height:300px;overflow:auto}
.note{background:var(--warnbg);color:#7a4a00;border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.stars button{background:none;border:0;font-size:24px;color:#cdd3e2;cursor:pointer;padding:0 2px}.stars button.on{color:#f5b301}
</style>
</head>
<body>
<div id="app"><div id="view"></div></div>
<div id="np"><div class="t"></div><button class="btn sm" data-act="stop">⏹</button></div>
<div id="toast"></div>
<div id="sheet"><div class="box"></div></div>
<nav><div class="in">
<a href="#home" data-r="home"><b>🏠</b>Hôm nay</a>
<a href="#speak" data-r="speak"><b>🎙️</b>Nói</a>
<a href="#vocab" data-r="vocab"><b>🔤</b>Từ vựng</a>
<a href="#more" data-r="more"><b>📚</b>Học thêm</a>
<a href="#me" data-r="me"><b>👤</b>Hồ sơ</a>
</div></nav>
<script>
/* ===== Seed data: band 5.0-5.5, communication + IELTS ===== */
const TOPICS = [
  { id: "family", vi: "Gia đình & bản thân", ic: "👨‍👩‍👧" },
  { id: "hometown", vi: "Quê hương & nơi ở", ic: "🏡" },
  { id: "food", vi: "Ăn uống", ic: "🍜" },
  { id: "work", vi: "Công việc & học tập", ic: "💼" },
  { id: "hobbies", vi: "Sở thích", ic: "🎧" },
  { id: "travel", vi: "Du lịch", ic: "✈️" },

  { id: "health", vi: "Sức khỏe", ic: "💪" }
];

/* word, nghĩa, ví dụ */
const SEED_VOCAB = {
  family: [
    ["relatives", "họ hàng", "I have many relatives in the countryside."],
    ["get along with", "hòa thuận với", "I get along with my sister very well."],
    ["close-knit", "gắn bó, thân thiết", "We are a close-knit family."],
    ["only child", "con một", "I am an only child, so I feel a bit lonely."],
    ["grow up", "lớn lên", "I grew up in a small town."],
    ["take care of", "chăm sóc", "My mother takes care of my grandparents."],
    ["generation", "thế hệ", "Three generations live in my house."],
    ["strict", "nghiêm khắc", "My father is quite strict about homework."],
    ["support", "ủng hộ, hỗ trợ", "My parents always support my decisions."],
    ["be similar to", "giống với", "I am similar to my mother in many ways."]
  ],
  hometown: [
    ["countryside", "vùng quê", "I love the fresh air in the countryside."],
    ["crowded", "đông đúc", "The city centre is always crowded."],
    ["peaceful", "yên bình", "My village is quiet and peaceful."],
    ["traffic jam", "tắc đường", "I was late because of a traffic jam."],
    ["neighbourhood", "khu phố", "It is a friendly neighbourhood."],
    ["local", "địa phương", "Local people are very kind."],
    ["tourist attraction", "điểm tham quan", "The old town is a famous tourist attraction."],
    ["public transport", "phương tiện công cộng", "Public transport is cheap here."],
    ["cost of living", "chi phí sinh hoạt", "The cost of living in big cities is high."],

  ],
  food: [
    ["delicious", "ngon", "The soup was absolutely delicious."],
    ["spicy", "cay", "I can't eat very spicy food."],
    ["ingredient", "nguyên liệu", "Fresh ingredients make the dish tasty."],
    ["recipe", "công thức nấu ăn", "I learned this recipe from my grandmother."],
    ["junk food", "đồ ăn vặt, đồ ăn nhanh", "Eating too much junk food is unhealthy."],
    ["cuisine", "ẩm thực", "Vietnamese cuisine is famous around the world."],
    ["vegetarian", "người ăn chay", "My friend is vegetarian, so we chose a veggie restaurant."],
    ["snack", "đồ ăn nhẹ", "I usually have a snack in the afternoon."],
    ["cook", "nấu ăn", "I cook dinner for my family twice a week."],
    ["be fond of", "thích", "I am fond of seafood."]
  ],
  work: [
    ["major", "chuyên ngành", "My major is business."],
    ["deadline", "hạn chót", "I have a deadline on Friday."],
    ["colleague", "đồng nghiệp", "My colleagues are friendly and helpful."],
    ["salary", "lương", "The salary is not high, but the job is stable."],
    ["experience", "kinh nghiệm", "I have two years of experience in sales."],
    ["career", "sự nghiệp", "I want to build a career in marketing."],
    ["part-time job", "việc làm thêm", "I had a part-time job when I was a student."],
    ["challenging", "đầy thử thách", "My job is challenging but interesting."],
    ["be responsible for", "chịu trách nhiệm về", "I am responsible for customer service."],
    ["graduate", "tốt nghiệp", "I graduated from university in 2022."]
  ],
  hobbies: [
    ["spare time", "thời gian rảnh", "In my spare time, I listen to music."],
    ["relax", "thư giãn", "Reading helps me relax after work."],
    ["be keen on", "đam mê, thích", "I am keen on photography."],
    ["go hiking", "đi bộ đường dài", "We go hiking in the mountains every summer."],
    ["practise", "luyện tập", "I practise English every evening."],
    ["entertainment", "giải trí", "Watching films is my main entertainment."],
    ["creative", "sáng tạo", "Painting makes me feel creative."],
    ["take up", "bắt đầu (một sở thích)", "I took up yoga last year."],
    ["hang out", "đi chơi, tụ tập", "I often hang out with friends at weekends."],
    ["enjoy", "tận hưởng, thích", "I really enjoy cooking for my friends."]
  ],
  travel: [
    ["journey", "chuyến đi", "The journey took about five hours."],
    ["destination", "điểm đến", "Da Nang is a popular destination."],
    ["luggage", "hành lý", "My luggage was very heavy."],
    ["book a ticket", "đặt vé", "I booked a ticket online."],
    ["sightseeing", "tham quan", "We went sightseeing all day."],
    ["accommodation", "chỗ ở", "Accommodation in the city centre is expensive."],
    ["passport", "hộ chiếu", "Don't forget your passport."],
    ["itinerary", "lịch trình", "Our itinerary included three cities."],
    ["souvenir", "quà lưu niệm", "I bought a small souvenir for my mother."],
    ["Could you tell me the way to...?", "Bạn chỉ giúp đường đến ... được không?", "Excuse me, could you tell me the way to the station?"]
  ],
  tech: [
    ["smartphone", "điện thoại thông minh", "I use my smartphone every day."],
    ["application", "ứng dụng", "This application helps me learn English."],
    ["online", "trực tuyến", "I often study online."],
    ["download", "tải xuống", "I downloaded a new app yesterday."],
    ["social media", "mạng xã hội", "I spend too much time on social media."],
    ["device", "thiết bị", "Many people use more than one device."],
    ["battery", "pin", "My phone battery runs out quickly."],
    ["update", "cập nhật", "Please update the app to the latest version."],
    ["be addicted to", "nghiện", "Some teenagers are addicted to games."],
    ["useful", "hữu ích", "Maps are very useful when I travel."]
  ],
  health: [
    ["exercise", "tập thể dục", "I exercise three times a week."],
    ["balanced diet", "chế độ ăn cân bằng", "A balanced diet is good for your health."],
    ["stressed", "căng thẳng", "I feel stressed before exams."],
    ["fit", "khỏe mạnh, cân đối", "She keeps fit by swimming."],
    ["get enough sleep", "ngủ đủ giấc", "I try to get enough sleep every night."],
    ["habit", "thói quen", "Drinking water is a good habit."],
    ["energy", "năng lượng", "Breakfast gives me energy for the day."],
    ["take a rest", "nghỉ ngơi", "You should take a rest if you feel tired."],
    ["see a doctor", "đi khám bác sĩ", "If it gets worse, see a doctor."],
    ["recover", "hồi phục", "It took me a week to recover from the flu."]
  ]
};

/* ===== Speaking Part 1 / 2 / 3 ===== */
const SPEAKING = [
  /* ---- Part 1 ---- */
  { id: "p1-fam-1", part: 1, topic: "family", q: "Tell me about your family.", hint: "Nói về số người, ai làm gì, bạn thân ai nhất.",
    ideas: ["number of people", "parents' jobs", "who you are close to"],
    sample: "There are four people in my family: my parents, my younger brother and me. My father is an engineer and my mother is a teacher. I am very close to my mother because she always listens to me. We often have dinner together in the evening, and I really enjoy that time.",
    phrases: ["There are ... people in my family", "I am very close to ...", "We often ... together"] },
  { id: "p1-fam-2", part: 1, topic: "family", q: "Do you get along well with your family members?", hint: "Có hòa thuận không? Ví dụ cụ thể.",
    ideas: ["yes + reason", "an example", "small arguments"],
    sample: "Yes, I do. We get along quite well because we talk to each other a lot. Of course, sometimes my brother and I argue about small things, like using the TV, but we always make up quickly. I think a close-knit family is really important.",
    phrases: ["We get along well because...", "Of course, sometimes...", "I think ... is really important"] },
  { id: "p1-fam-3", part: 1, topic: "family", q: "What do you usually do with your family at weekends?", hint: "Hoạt động cuối tuần cùng gia đình.",
    ideas: ["eat out", "visit relatives", "stay at home"],
    sample: "At weekends, we usually have a big lunch together. Sometimes we visit my grandparents in the countryside, and my mother cooks traditional dishes. If the weather is nice, we go to the park. It is a good way to relax after a busy week.",
    phrases: ["At weekends, we usually...", "Sometimes we...", "It is a good way to relax"] },

  { id: "p1-home-1", part: 1, topic: "hometown", q: "Where is your hometown?", hint: "Nằm ở đâu, nổi tiếng gì.",
    ideas: ["location", "famous for", "size"],
    sample: "My hometown is a small city in the north of Vietnam. It is about two hours from Hanoi by bus. It is famous for its beautiful lake and delicious local food. It is not very big, so life there is quiet and slow.",
    phrases: ["My hometown is ... in the north/south of...", "It is famous for...", "life there is quiet"] },
  { id: "p1-home-2", part: 1, topic: "hometown", q: "Do you like living in your city? Why?", hint: "Thích/không thích + 2 lý do.",
    ideas: ["convenient", "friendly people", "problems: traffic, noise"],
    sample: "Yes, I do. It is very convenient because there are many shops, schools and hospitals near my house. People here are also friendly. However, the traffic is sometimes terrible, especially in the morning, and that makes me a little tired.",
    phrases: ["It is very convenient because...", "However, ...", "especially in the morning"] },
  { id: "p1-home-3", part: 1, topic: "hometown", q: "What do you like most about your neighbourhood?", hint: "Điều bạn thích nhất ở khu phố.",
    ideas: ["neighbours", "food street", "safe"],
    sample: "What I like most is the neighbours. They are kind and always say hello when we meet. There is also a small market near my house where I can buy fresh vegetables every morning. I feel very safe and comfortable there.",
    phrases: ["What I like most is...", "There is also...", "I feel very safe"] },

  { id: "p1-food-1", part: 1, topic: "food", q: "What kind of food do you like?", hint: "Món yêu thích + lý do.",
    ideas: ["favourite dish", "taste", "who cooks it"],
    sample: "I am fond of noodle soup, especially pho. I like it because the soup is hot and tasty, and it is not too heavy. I often have it for breakfast, and my mother cooks it really well at home.",
    phrases: ["I am fond of...", "I like it because...", "especially..."] },
  { id: "p1-food-2", part: 1, topic: "food", q: "Do you cook at home?", hint: "Có nấu không? Nấu gì? Thường xuyên không?",
    ideas: ["how often", "simple dishes", "learn from"],
    sample: "Yes, I cook dinner about twice a week. I can make simple dishes like fried rice and vegetable soup. I learned some recipes from my grandmother. Cooking is a good way to relax, and my family enjoys my meals.",
    phrases: ["I cook ... about twice a week", "I can make simple dishes like...", "I learned ... from..."] },
  { id: "p1-food-3", part: 1, topic: "food", q: "Do you prefer eating at home or in restaurants?", hint: "Chọn một + so sánh.",
    ideas: ["healthy", "cheaper", "social"],
    sample: "I prefer eating at home. It is cheaper and healthier because I can choose fresh ingredients. However, I sometimes go to restaurants with friends at weekends because it is a good chance to chat and try new dishes.",
    phrases: ["I prefer ...ing", "It is cheaper and healthier", "a good chance to..."] },

  { id: "p1-work-1", part: 1, topic: "work", q: "Do you work or are you a student?", hint: "Công việc/học gì, thích điểm nào.",
    ideas: ["job/major", "how long", "what you like"],
    sample: "I work as an office worker in a small company. I have been there for about two years. My job is to prepare documents and answer customers' emails. It is sometimes stressful, but I like my colleagues because they are very helpful.",
    phrases: ["I work as...", "I have been there for...", "It is sometimes stressful, but..."] },
  { id: "p1-work-2", part: 1, topic: "work", q: "Why did you choose that job / major?", hint: "Lý do chọn.",
    ideas: ["interest", "family advice", "future"],
    sample: "I chose it because I am interested in business and I think it has good opportunities in the future. My parents also gave me some advice. Although it is challenging, I have learned a lot of useful skills.",
    phrases: ["I chose it because...", "Although it is challenging, ...", "I have learned a lot of..."] },
  { id: "p1-work-3", part: 1, topic: "work", q: "What do you want to do in the future?", hint: "Kế hoạch tương lai.",
    ideas: ["career goal", "study abroad", "improve English"],
    sample: "In the future, I want to improve my English and get a better job. Maybe I will work for an international company. That is why I am studying IELTS now. I hope I can reach band 5.5 or higher.",
    phrases: ["In the future, I want to...", "That is why I am...", "I hope I can..."] },

  { id: "p1-hob-1", part: 1, topic: "hobbies", q: "What do you do in your free time?", hint: "2-3 hoạt động + lý do.",
    ideas: ["listen to music", "watch films", "meet friends"],
    sample: "In my free time, I usually listen to music or watch films. On weekends, I hang out with my friends and we drink coffee together. I think these activities help me relax after a stressful week.",
    phrases: ["In my free time, I usually...", "I hang out with...", "help me relax"] },
  { id: "p1-hob-2", part: 1, topic: "hobbies", q: "Have you ever tried a new hobby?", hint: "Sở thích mới đã thử.",
    ideas: ["what", "why", "result"],
    sample: "Yes, last year I took up yoga. I wanted to reduce stress and keep fit. At first it was difficult, but now I practise three times a week and I feel more energetic.",
    phrases: ["I took up...", "I wanted to...", "At first ..., but now..."] },
  { id: "p1-hob-3", part: 1, topic: "hobbies", q: "Do you prefer indoor or outdoor activities?", hint: "Chọn + lý do.",
    ideas: ["weather", "health", "friends"],
    sample: "I prefer outdoor activities, like cycling or going for a walk, because they are good for my health and I can enjoy fresh air. But when it rains, I stay at home and read books.",
    phrases: ["I prefer ... because...", "good for my health", "But when it rains, ..."] },

  { id: "p1-trv-1", part: 1, topic: "travel", q: "Do you like travelling?", hint: "Thích không, vì sao.",
    ideas: ["new places", "relax", "culture"],

/* ===== Core: store, utils, TTS, audio store, sheet ===== */
const KEY = "engcoach_v1";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ld = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return ld(d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const topicName = id => (TOPICS.find(t => t.id === id) || { vi: "Khác" }).vi;
const topicIc = id => (TOPICS.find(t => t.id === id) || { ic: "📌" }).ic;
const splitSent = t => (String(t).replace(/\s+/g, " ").match(/[^.!?]+[.!?]*["')]*/g) || [t]).map(s => s.trim()).filter(Boolean);

function defaults() {
  return { v: 1, profile: { level: "5.0-5.5", goal: "IELTS 5.0-5.5 + giao tiếp hằng ngày", data: {} }, vocab: [], mine: {}, speakLog: [], sources: [], writings: [], reads: {}, listen: { ok: 0, total: 0 }, daily: {}, streak: { last: "", count: 0 }, custom: [], settings: { rate: 0.9, voice: "" }, seeded: false };
}
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { }
  s = Object.assign(defaults(), s || {});
  if (!s.seeded) { seedVocab(s); s.seeded = true; }
  return s;
}
function seedVocab(s) {
  Object.entries(SEED_VOCAB).forEach(([t, arr]) => arr.forEach((x, i) => s.vocab.push({ id: "s-" + t + "-" + i, w: x[0], vi: x[1], ex: x[2], topic: t, box: -1, due: "", added: ld(), correct: 0, wrong: 0, seed: true })));
}
let S = load();
let saveT = null, memFallback = false;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { memFallback = true; } }, 250);
}
function saveNow() { clearTimeout(saveT); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { memFallback = true; } }

function bump(k, n = 1) {
  const d = ld();
  S.daily[d] = S.daily[d] || {};
  S.daily[d][k] = (S.daily[d][k] || 0) + n;
  if (S.streak.last !== d) {
    const y = addDays(-1);
    S.streak.count = S.streak.last === y ? S.streak.count + 1 : 1;
    S.streak.last = d;
  }
  save();
}
const today = () => S.daily[ld()] || {};

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2400);
}
function openSheet(html) { $("#sheet .box").innerHTML = html; $("#sheet").classList.add("show"); }
function closeSheet() { $("#sheet").classList.remove("show"); }

  try { await navigator.clipboard.writeText(text); toast("Đã sao chép ✓"); return true; } catch (e) { }
  const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) { }
  ta.remove(); toast(ok ? "Đã sao chép ✓" : "Không sao chép được, hãy bôi đen và copy tay"); return ok;
}
function downloadFile(name, text, type = "text/plain") {
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" }));
    a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  } catch (e) { toast("Trình duyệt chặn tải xuống, hãy dùng nút Sao chép"); }
}

/* ===== TTS ===== */
let ttsToken = 0, voiceList = [];
function loadVoices() { try { voiceList = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); } catch (e) { } }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice() {
  if (S.settings.voice) { const v = voiceList.find(v => v.name === S.settings.voice); if (v) return v; }
  return voiceList.find(v => /en[-_]US/i.test(v.lang)) || voiceList[0] || null;
}
function stopSpeak() { ttsToken++; try { speechSynthesis.cancel(); } catch (e) { } hideNP(); $$(".sent.cur").forEach(e => e.classList.remove("cur")); }
function speakOnce(text, rate, tok) {
  return new Promise(res => {
    if (!("speechSynthesis" in window)) { toast("Máy chưa hỗ trợ đọc giọng nói"); return res(); }
    const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = rate || S.settings.rate || 0.9;
    const v = pickVoice(); if (v) u.voice = v;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(() => { if (tok === ttsToken) speechSynthesis.speak(u); else fin(); }, 60);
    setTimeout(fin, Math.max(8000, text.length * 160));
  });
}
const waitMs = ms => new Promise(r => setTimeout(r, ms));
async function playText(text, o = {}) {
  stopSpeak(); const tok = ttsToken;
  const sents = splitSent(text);
  for (let i = 0; i < sents.length; i++) {
    if (tok !== ttsToken) return;
    showNP(sents[i], i + 1, sents.length, o.shadow ? "Nghe, rồi nhắc lại thành tiếng" : "Đang đọc");
    const el = o.scope ? $$(".sent", $(o.scope))[i] : null;
    $$(".sent.cur").forEach(e => e.classList.remove("cur")); if (el) { el.classList.add("cur"); }
    await speakOnce(sents[i], o.rate, tok);
    if (tok !== ttsToken) return;
    if (o.shadow) await waitMs(Math.max(1800, sents[i].split(" ").length * 650));
  }
  if (tok === ttsToken) { hideNP(); $$(".sent.cur").forEach(e => e.classList.remove("cur")); if (o.onend) o.onend(); }
}
function showNP(t, i, n, label) { const e = $("#np"); e.classList.add("show"); $(".t", e).innerHTML = `<small>${esc(label)} · ${i}/${n}</small>${esc(t)}`; }
function hideNP() { $("#np").classList.remove("show"); }
function audioBar(text, scope) {
  const t = esc(text), sc = scope ? ` data-scope="${esc(scope)}"` : "";
  return `<div class="abar"><button class="btn sm" data-act="say" data-t="${t}"${sc}>🔊 Nghe</button><button class="btn sm sec" data-act="say" data-r="0.62" data-t="${t}"${sc}>🐢 Chậm</button><button class="btn sm sec" data-act="shadow" data-t="${t}"${sc}>🗣 Nhắc lại theo</button></div>`;
}
function micro(text) { return `<button class="btn sm ghost" data-act="say" data-t="${esc(text)}" aria-label="Nghe">🔊</button>`; }

/* ===== Audio recordings in IndexedDB ===== */
let _db = null;
function idb() {
  return new Promise((res, rej) => {
    if (_db) return res(_db);
    try {
      const rq = indexedDB.open("engcoach", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("rec");
      rq.onsuccess = () => { _db = rq.result; res(_db); };
      rq.onerror = () => rej(rq.error);
    } catch (e) { rej(e); }
  });
}
async function idbPut(k, blob) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction("rec", "readwrite"); tx.objectStore("rec").put(blob, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const rq = db.transaction("rec").objectStore("rec").get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
async function idbDel(k) { try { const db = await idb(); db.transaction("rec", "readwrite").objectStore("rec").delete(k); } catch (e) { } }

/* ===== SRS ===== */
const INTERVALS = [0, 1, 2, 4, 8, 16, 30];
function grade(w, g) { /* g: 0 quên, 1 hơi nhớ, 2 nhớ rõ */
  if (g === 0) { w.box = 0; w.due = ld(); w.wrong++; }
  else if (g === 1) { w.box = Math.max(1, w.box < 0 ? 1 : w.box); w.due = addDays(INTERVALS[w.box] || 1); w.correct++; }
  else { w.box = Math.min(6, (w.box < 0 ? 0 : w.box) + 1); w.due = addDays(INTERVALS[w.box]); w.correct++; }
  save();
}
const dueWords = (topic) => S.vocab.filter(w => w.box >= 0 && w.due <= ld() && (!topic || w.topic === topic));
const newWords = (topic) => S.vocab.filter(w => w.box < 0 && (!topic || w.topic === topic));
const learnedWords = () => S.vocab.filter(w => w.box >= 4);
function addVocab(w, vi, ex, topic, src) {
  w = w.trim(); if (!w) return null;
  const dup = S.vocab.find(x => x.w.toLowerCase() === w.toLowerCase());
  if (dup) return dup;
  const o = { id: uid(), w, vi: vi.trim(), ex: (ex || "").trim(), topic: topic || "family", box: 0, due: ld(), added: ld(), correct: 0, wrong: 0, src: src || "" };
  S.vocab.unshift(o); save(); return o;
}
const allSpeaking = () => SPEAKING.concat(S.custom);

/* ---- games ---- */
function gamePool() {
  const pool = S.vocab.filter(w => !U.vtopic || w.topic === U.vtopic);
  return pool.length >= 4 ? pool : S.vocab;
}
function startGame(type) {
  const pool = gamePool();
  if (pool.length < 4) { U.game = { type, err: true }; return; }
  if (type === "match") {
    const ws = shuffle(pool).slice(0, 6);
    U.game = { type, ws, left: ws.map(w => w.id), right: shuffle(ws.map(w => w.id)), sel: null, done: [], wrongs: 0, t0: Date.now() };
    return;
  }
  const qs = shuffle(pool).slice(0, 10);
  U.game = { type, qs, i: 0, score: 0, ans: null, wrong: [], pool };
}
function gameOpts(g, w) {
  const useVi = g.type === "quiz";
  const others = shuffle(g.pool.filter(x => x.id !== w.id && (useVi ? x.vi !== w.vi : x.w !== w.w))).slice(0, 3);
  return shuffle([w, ...others]);
}
function vGame(type) {
  if (!U.game || U.game.type !== type) startGame(type);
  const g = U.game;
  const titles = { quiz: "Chọn nghĩa", rev: "Chọn từ", listen: "Nghe & chọn", type: "Gõ từ", match: "Ghép cặp" };
  const back = head(titles[type], "vocab");
  if (g.err) return back + `<div class="card">Cần ít nhất 4 từ trong danh sách để chơi.</div>`;
  if (type === "match") {
    const byId = id => S.vocab.find(w => w.id === id);
    const fin = g.done.length === g.ws.length;
    if (fin) { bump("games"); const sec = Math.round((Date.now() - g.t0) / 1000); U.game = null; return back + `<div class="card c"><div style="font-size:44px">🧩</div><h2>Hoàn thành!</h2><p>${sec} giây · ${g.wrongs} lần nối sai</p><button class="btn block" data-act="again" data-v="match">Chơi lại</button></div>`; }
    return back + `<p class="mute sm c">Chạm một từ rồi chạm nghĩa tương ứng.</p><div class="pairs">${g.left.map((id, k) => {
      const l = byId(id), r = byId(g.right[k]);
      return `<button class="opt ${g.done.includes(id) ? "gone" : ""} ${g.sel === "L" + id ? "sel" : ""}" data-act="mpick" data-s="L" data-id="${id}">${esc(l.w)}</button><button class="opt ${g.done.includes(r.id) ? "gone" : ""} ${g.sel === "R" + r.id ? "sel" : ""}" data-act="mpick" data-s="R" data-id="${r.id}">${esc(r.vi)}</button>`;
    }).join("")}</div>`;
  }
  if (g.i >= g.qs.length) {
    bump("games"); const sc = g.score, tot = g.qs.length, wr = g.wrong; U.game = null;
    return back + `<div class="card c"><div style="font-size:44px">${sc >= tot * .8 ? "🏆" : "👍"}</div><h2>${sc}/${tot} đúng</h2>${wr.length ? `<div style="text-align:left"><b>Ôn lại:</b>${wr.map(w => `<div>${esc(w.w)} — ${esc(w.vi)} ${micro(w.w)}</div>`).join("")}</div>` : "<p>Hoàn hảo!</p>"}<button class="btn block" style="margin-top:10px" data-act="again" data-v="${type}">Chơi lại</button></div>`;
  }
  const w = g.qs[g.i];
  const head2 = `<div class="prog"><i style="width:${g.i / g.qs.length * 100}%"></i></div><p class="sm mute c">Câu ${g.i + 1}/${g.qs.length} · ${g.score} điểm</p>`;
  if (type === "type") {
    const ex = (w.ex || "").replace(new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig"), "_____");
    return back + head2 + `<div class="card c"><div style="font-size:22px;font-weight:700">${esc(w.vi)}</div>${ex && ex !== w.ex ? `<p class="mute">${esc(ex)}</p>` : ""}<input type="text" id="tans" autocomplete="off" autocapitalize="none" placeholder="Gõ từ tiếng Anh..." ${g.ans ? "disabled" : ""} value="${esc(g.ans ? g.ans.val : "")}" style="margin-top:8px">
    ${g.ans ? `<p style="font-weight:700;color:${g.ans.ok ? "var(--ok)" : "var(--bad)"}">${g.ans.ok ? "Đúng!" : "Đáp án: " + esc(w.w)}</p><button class="btn block" data-act="gnext">Tiếp ›</button>` : `<button class="btn block" style="margin-top:8px" data-act="tcheck">Kiểm tra</button><button class="btn sm ghost" data-act="say" data-t="${esc(w.w)}">🔊 Gợi ý: nghe</button>`}</div>`;
  }
  if (!g.opts || g.opts.q !== g.i) g.opts = { q: g.i, list: gameOpts(g, w) };
  const prompt = type === "quiz" ? `<div class="big" style="font-size:28px;font-weight:800">${esc(w.w)}</div>${micro(w.w)}` : type === "rev" ? `<div style="font-size:24px;font-weight:800">${esc(w.vi)}</div>` : `<button class="btn" data-act="say" data-t="${esc(w.w)}">🔊 Nghe lại</button><p class="mute sm">Nghe và chọn từ đúng</p>`;
  return back + head2 + `<div class="card c">${prompt}</div>` + g.opts.list.map(o => {
    const label = type === "quiz" ? o.vi : o.w;
    let cls = ""; if (g.ans) { if (o.id === w.id) cls = "ok"; else if (o.id === g.ans.id) cls = "bad"; }
    return `<button class="opt ${cls}" data-act="gpick" data-id="${o.id}" ${g.ans ? "disabled" : ""}>${esc(label)}</button>`;
  }).join("") + (g.ans ? `<button class="btn block" data-act="gnext">Tiếp ›</button>` : "");
}
function afterGameShow() {
  const g = U.game; if (!g || g.err) return;
  if ((g.type === "listen") && g.qs && g.i < g.qs.length && !g.ans && !g.spoken) { g.spoken = g.i; setTimeout(() => playText(g.qs[g.i].w, { rate: 0.8 }), 250); }

/* ---- Listening ---- */
function dictPool() {
  const fromSrc = S.sources.flatMap(s => splitSent(s.text)).filter(x => x.split(" ").length >= 4 && x.split(" ").length <= 18);
  const fromMine = Object.values(S.mine).flatMap(t => splitSent(t)).filter(x => x.split(" ").length >= 4 && x.split(" ").length <= 18);
  return { base: LISTENING, mine: fromSrc.concat(fromMine) };
}
function vListen() {
  const P = dictPool();
  if (!U.dict) U.dict = { mode: "base", i: 0, list: null, res: null, n: 0, ok: 0 };
  const D = U.dict;
  if (!D.list) { D.list = shuffle(D.mode === "mine" && P.mine.length ? P.mine : P.base).slice(0, 8); D.i = 0; D.res = null; }
  const acc = S.listen.total ? Math.round(S.listen.ok / S.listen.total * 100) : 0;
  if (D.i >= D.list.length) { const n = D.ok; U.dict = null; return `${head("Nghe chép", "more")}<div class="card c"><div style="font-size:44px">🎧</div><h2>Xong bộ câu!</h2><p>Chính xác: ${n}/${D.list.length} câu</p><button class="btn block" data-act="dnew">Bộ mới</button></div>`; }
  const sent = D.list[D.i];
  return `${head("Nghe chép", "more")}
  <div><span class="chip ${D.mode === "base" ? "on" : ""}" data-act="dmode" data-v="base">Câu có sẵn</span><span class="chip ${D.mode === "mine" ? "on" : ""}" data-act="dmode" data-v="mine">Từ nguồn & bài của tôi (${P.mine.length})</span></div>
  <p class="sm mute">Độ chính xác tích lũy: ${acc}% · Câu ${D.i + 1}/${D.list.length}</p>
  <div class="card c"><div class="row" style="justify-content:center"><button class="btn" data-act="say" data-t="${esc(sent)}">🔊 Nghe</button><button class="btn sec" data-act="say" data-r="0.6" data-t="${esc(sent)}">🐢 Chậm</button></div>
  <textarea id="dans" style="min-height:70px;margin-top:10px" autocapitalize="none" placeholder="Gõ lại câu bạn nghe được..." ${D.res ? "disabled" : ""}>${esc(D.res ? D.res.val : "")}</textarea>
  ${D.res ? `<div class="diff" style="text-align:left;margin:8px 0">${D.res.html}</div><p><b>${D.res.pct}%</b> chính xác</p><button class="btn block" data-act="dnext">Câu tiếp ›</button>` : `<div class="row" style="margin-top:8px"><button class="btn grow" data-act="dcheck">Kiểm tra</button><button class="btn sec" data-act="dshow">Xem đáp án</button></div>`}</div>`;
}
const norm = t => t.toLowerCase().replace(/[’]/g, "'").replace(/[^a-z0-9' ]/g, " ").split(/\s+/).filter(Boolean);
function diffWords(ref, ans) {
  const A = norm(ref), B = norm(ans), m = A.length, n = B.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ok = new Array(m).fill(false); let i = 0, j = 0;
  while (i < m && j < n) { if (A[i] === B[j]) { ok[i] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  return { html: A.map((w, k) => `<span class="${ok[k] ? "g" : "r"}">${esc(w)}</span>`).join(" "), pct: m ? Math.round(ok.filter(Boolean).length / m * 100) : 0 };
}

  } else {
    const weak = S.vocab.filter(w => w.wrong >= 2 || (w.box >= 0 && w.box <= 1 && w.wrong >= 1)).slice(0, 15);
    L.push(`\n## Tiến độ\n- Số ngày có học: ${days}, chuỗi hiện tại: ${S.streak.count}\n- Từ vựng: ${S.vocab.length} tổng, ${S.vocab.filter(w => w.box >= 0).length} đã học, ${learnedWords().length} đã thuộc\n- Nghe chép: ${S.listen.total ? Math.round(S.listen.ok / S.listen.total * 100) + "%" : "chưa có"}\n- Đọc hiểu: ${Object.entries(S.reads).map(([k, v]) => k + "=" + v).join(", ") || "chưa có"}`);
    if (weak.length) L.push(`\n## Từ hay quên\n` + weak.map(w => `- ${w.w} (${w.vi})`).join("\n"));
    const mine = S.vocab.filter(w => !w.seed).slice(0, 15);
    if (mine.length) L.push(`\n## Từ tôi tự thêm gần đây\n` + mine.map(w => `- ${w.w}: ${w.vi}${w.ex ? " | " + w.ex : ""}`).join("\n"));
    const logs = S.speakLog.slice(-8).reverse();
    if (logs.length) L.push(`\n## Nhật ký Speaking gần đây\n` + logs.map(l => `### ${l.date} · ${l.q}\n- Tự chấm (trôi chảy/từ vựng/ngữ pháp/phát âm): ${["flu", "voc", "gra", "pro"].map(k => l.rate[k] || 0).join("/")}\n- Lời tôi nói: ${l.tr || "(không có)"}\n- Lỗi tôi ghi: ${l.mist || "(không có)"}`).join("\n"));
    const ans = Object.entries(S.mine).filter(([, v]) => v.trim()).slice(-5);
    if (ans.length) L.push(`\n## Câu trả lời tôi tự soạn\n` + ans.map(([k, v]) => { const q = allSpeaking().find(x => x.id === k); return `- Q: ${q ? q.q : k}\n  A: ${v}`; }).join("\n"));
    if (S.writings.length) L.push(`\n## Bài viết gần đây\n` + S.writings.slice(0, 2).map(w => `- (${w.id}, ${wc(w.text)} từ) ${w.text.slice(0, 600)}`).join("\n"));
    L.push(`\n## Yêu cầu của tôi\n1. Nhận xét tiến độ và 3 điểm yếu lớn nhất.\n2. Sửa lỗi trong nhật ký Speaking, đưa câu đúng và lý do.\n3. Đóng vai giám khảo: hỏi tôi lần lượt 5 câu Part 1 dựa trên thông tin cá nhân, chờ tôi trả lời từng câu rồi nhận xét.\n4. Cho kế hoạch học 7 ngày tới và 10 từ/cụm mới theo chủ đề tôi hay nói.`);
  }
  return L.join("\n");
}

/* ===== Router + events ===== */
const R = { mr: null, chunks: [], stream: null, t0: 0, iv: null, blob: null, recog: null };
function recCleanup() {
  try { if (R.mr && R.mr.state === "recording") { R.mr.onstop = null; R.mr.stop(); } } catch (e) { }
  try { R.stream && R.stream.getTracks().forEach(t => t.stop()); } catch (e) { }
  try { R.recog && R.recog.stop(); } catch (e) { }
  clearInterval(R.iv); R.mr = null; R.recog = null; R.blob = null;
}
function currentHtml() {
  const p = (location.hash || "#home").slice(1).split("/");
  switch (p[0]) {
    case "speak": return p[1] ? vSpeak(p[1]) : vSpeakList();
    case "vocab":
      if (p[1] === "list") return vVocabList();
      if (p[1] === "study") return vStudy();
      if (p[1] === "game") return vGame(p[2]);
      return vVocab();
    case "more":
      if (p[1] === "sources") return vSources();
      if (p[1] === "source") return vSource(p[2]);
      if (p[1] === "listen") return vListen();
      if (p[1] === "read") return p[2] ? vRead(p[2]) : vReadList();
      if (p[1] === "write") return p[2] ? vWrite(p[2]) : vWriteList();
      return vMore();
    case "me": return vMe();
    default: return vHome();
  }
}
function draw(scroll) {
  const y = window.scrollY;
  view().innerHTML = currentHtml();
  const seg = (location.hash || "#home").slice(1).split("/")[0] || "home";
  $$("nav a").forEach(a => a.classList.toggle("on", a.dataset.r === (["home", "speak", "vocab", "more", "me"].includes(seg) ? seg : "home")));
  if (scroll) window.scrollTo(0, 0); else window.scrollTo(0, y);
  const prev = $("#repPrev"); if (prev) prev.textContent = reportText("coach");
  afterGameShow();
}
function route() {
  stopSpeak(); recCleanup();
  const h = (location.hash || "#home").slice(1);
  if (!h.startsWith("vocab/study")) U.flash = null;
  if (!h.startsWith("vocab/game")) U.game = null;
  draw(true);
}

  async rec() {

    if (!navigator.mediaDevices || !window.MediaRecorder) return toast("Trình duyệt này chưa hỗ trợ ghi âm");
    try { R.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast("Cần cho phép micro để ghi âm (hoặc mở app bằng Chrome)"); }
    R.chunks = []; R.mr = new MediaRecorder(R.stream);
    R.mr.ondataavailable = e => { if (e.data && e.data.size) R.chunks.push(e.data); };
    R.mr.onstop = () => {
      clearInterval(R.iv); R.stream.getTracks().forEach(t => t.stop());
      R.blob = new Blob(R.chunks, { type: R.mr.mimeType || "audio/webm" });
      const sec = Math.round((Date.now() - R.t0) / 1000);
      const b = $("#recBtn"), o = $("#recOut"), t = $("#recTime");

    let fin = $("#tr").value.trim();
    r.onresult = e => { let it = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += (fin ? " " : "") + t.trim(); else it += t; } const tr = $("#tr"); if (tr) tr.value = (fin + " " + it).trim(); };

    try { r.start(); R.recog = r; btn.textContent = "⏹ Dừng nhận giọng nói"; } catch (e) { toast("Không bật được nhận giọng nói"); }

  rreset() { U.read = null; draw(); },
  saywrite() { const t = $("#wtxt").value.trim(); if (!t) return toast("Hãy viết vài câu trước"); playText(t); },
  sendwrite(el) { const d = S.writings.find(x => x.id === el.dataset.id); if (!d || !wc(d.text)) return toast("Hãy viết bài trước"); copyText(reportText("write", el.dataset.id)).then(() => toast("Đã sao chép. Dán vào chat với Claude để được chấm")); },
  copyrep() { copyText(reportText("coach")); },
  dlrep() { downloadFile("ho-so-hoc-" + ld() + ".md", reportText("coach"), "text/markdown"); },
  dljson() { downloadFile("engcoach-backup-" + ld() + ".json", JSON.stringify(S), "application/json"); },
  reset(el) { if (!confirmTap(el, "Bấm lần nữa để XÓA HẾT")) return; try { localStorage.removeItem(KEY); } catch (e) { } S = load(); saveNow(); location.hash = "#home"; draw(true); toast("Đã xóa dữ liệu"); }
};
document.addEventListener("click", e => {
  if (e.target.id === "sheet") return closeSheet();
  const a = e.target.closest("[data-act]");
  if (a) { const f = ACT[a.dataset.act]; if (f) { e.preventDefault(); f(a, e); return; } }
  const g = e.target.closest("[data-go]");
  if (g) location.hash = "#" + g.dataset.go;
});
document.addEventListener("input", e => {
  const t = e.target, b = t.dataset && t.dataset.bind;
  if (t.id === "vq") { U.vq = t.value; const q = U.vq.toLowerCase(); $("#vlist").innerHTML = vlistHtml(S.vocab.filter(w => (!U.vtopic || w.topic === U.vtopic) && (!q || w.w.toLowerCase().includes(q) || w.vi.toLowerCase().includes(q)))); return; }
  if (!b) return;
  const [k, id] = b.split(":");
  if (k === "mine") S.mine[id] = t.value;
  else if (k === "pf") S.profile.data[id] = t.value;
  else if (k === "pl") S.profile[id] = t.value;
  else if (k === "srcnote") { const s = S.sources.find(x => x.id === id); if (s) s.notes = t.value; }
  else if (k === "srcctx") { const s = S.sources.find(x => x.id === id); if (s) s.ctx = t.value; }
  else if (k === "write") {
    let d = S.writings.find(x => x.id === id); if (!d) { d = { id, text: "", ts: Date.now() }; S.writings.unshift(d); }
    d.text = t.value; d.ts = Date.now(); const c = $("#wc"); if (c) c.textContent = wc(t.value);
    if (wc(t.value) >= 40 && !today().write) bump("write");
  }
  save();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.bind === "rate:x") { S.settings.rate = +t.value; save(); }
  if (t.dataset && t.dataset.bind === "voice:x") { S.settings.voice = t.value; save(); }
  if (t.id === "imp" && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { try { const d = JSON.parse(fr.result); if (!d || !Array.isArray(d.vocab)) throw 0; S = Object.assign(defaults(), d); saveNow(); toast("Đã khôi phục ✓"); draw(true); } catch (err) { toast("File sao lưu không hợp lệ"); } };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "tans") { e.preventDefault(); ACT.tcheck(); } });
addEventListener("beforeunload", saveNow);

/* init */
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) { navigator.serviceWorker.register("sw.js").catch(() => { }); }
route();

</script>
</body>
</html>
